name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node.js ${{ matrix.node }}${{ matrix.npm && format(' (npm {0})', matrix.npm) || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        include:
          - node: 24
            npm: '12.2.0'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install the publishing npm CLI
        if: matrix.npm
        run: npm install --global npm@${{ matrix.npm }} --ignore-scripts
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Unit tests and coverage
        run: npm run test:coverage
      - name: Published 3.2.0 and packed candidate consumer integration
        run: npm run test:integration
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - name: Audit all dependencies with the tracked upstream exception
        run: node scripts/audit.js
