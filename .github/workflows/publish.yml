name: Publish to npm

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master, main]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to validate (dry run only; never publishes)
        required: true
        default: master
        type: choice
        options: [master, main]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'EasyAsABC123/grunt-standard' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == 'EasyAsABC123/grunt-standard'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      version: ${{ steps.release.outputs.version }}
      sha256: ${{ steps.pack.outputs.sha256 }}
      publish: ${{ steps.release.outputs.publish }}
      commit: ${{ steps.release.outputs.commit }}
    env:
      RELEASE_BRANCH: ${{ github.event.workflow_run.head_branch || inputs.ref || 'master' }}
    steps:
      - name: Check out the exact tested CI commit or dry-run branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.ref || 'master' }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          check-latest: true
          package-manager-cache: false
      - name: Install the pinned OIDC-capable npm CLI
        run: npm install --global npm@12.2.0 --ignore-scripts
      - name: Refresh the current canonical branch tip
        run: git fetch origin "refs/heads/$RELEASE_BRANCH:refs/remotes/origin/$RELEASE_BRANCH"
      - name: Validate CI source, current branch tip and registry eligibility
        id: release
        run: node scripts/release-check.js
      - name: Install locked dependencies without lifecycle scripts
        if: steps.release.outputs.eligible == 'true'
        run: npm ci --ignore-scripts
      - name: Run full tests
        if: steps.release.outputs.eligible == 'true'
        run: npm test
      - name: Audit production dependencies
        if: steps.release.outputs.eligible == 'true'
        run: npm audit --omit=dev
      - name: Audit all dependencies with the tracked upstream exception
        if: steps.release.outputs.eligible == 'true'
        run: node scripts/audit.js
      - name: Pack the validated source
        if: steps.release.outputs.eligible == 'true'
        id: pack
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          mkdir dist
          npm pack --ignore-scripts --pack-destination dist
          echo "sha256=$(sha256sum "dist/grunt-standard-$RELEASE_VERSION.tgz" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Validate publish command without publishing
        if: github.event_name == 'workflow_dispatch' && steps.release.outputs.eligible == 'true'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: npm publish "dist/grunt-standard-$RELEASE_VERSION.tgz" --dry-run --ignore-scripts --access public
      - name: Upload the immutable validated package
        if: steps.release.outputs.eligible == 'true'
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: validate
    if: github.repository == 'EasyAsABC123/grunt-standard' && github.event_name == 'workflow_run' && needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          check-latest: true
          package-manager-cache: false
      - name: Install the pinned OIDC-capable npm CLI
        run: npm install --global npm@12.2.0 --ignore-scripts
      - name: Download only the validated immutable artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact-id }}
          path: artifact
          digest-mismatch: error
      - name: Verify package bytes and publish with npm Trusted Publishing
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          TARBALL_SHA256: ${{ needs.validate.outputs.sha256 }}
          RELEASE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          VALIDATED_SHA: ${{ needs.validate.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          branch_sha="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/EasyAsABC123/grunt-standard/git/ref/heads/$RELEASE_BRANCH" \
            | node -e 'let data = ""; process.stdin.on("data", chunk => { data += chunk }); process.stdin.on("end", () => { console.log(JSON.parse(data).object.sha) })')"
          if [ "$branch_sha" != "$VALIDATED_SHA" ]; then
            echo '::notice::Skipping stale validated commit; the branch advanced during validation.'
            exit 0
          fi
          tarball="artifact/grunt-standard-$RELEASE_VERSION.tgz"
          printf '%s  %s\n' "$TARBALL_SHA256" "$tarball" | sha256sum --check --strict
          # workflow_run defaults identify the workflow branch, not its tested source.
          # npm uses these two variables for provenance source metadata; workflow
          # identity and signed OIDC claims remain the actual GitHub defaults.
          GITHUB_SHA="$VALIDATED_SHA" GITHUB_REF="refs/heads/$RELEASE_BRANCH" \
            npm publish "$tarball" --ignore-scripts --access public --provenance --registry https://registry.npmjs.org/
